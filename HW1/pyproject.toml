[project]
name = "hw1"
version = "0.1.0"
description = "NYCU DLCV HW1 - Image Classification"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "timm>=1.0.26",
    "wandb>=0.25.0",
    "tqdm>=4.67.0",
    "matplotlib>=3.10.0",
    "pandas>=3.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
