[project]
name = "vrdl-hw4"
version = "0.1.0"
description = "VRDL HW4 - Image Restoration (Rain + Snow) using PromptIR"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "numpy<2.0",
    "Pillow",
    "tqdm",
    "matplotlib",
    "opencv-python",
    "scikit-image",
    "einops",
    "lightning>=2.4.0",
    "lpips",
    "pyyaml",
    "wandb",
    "tensorboard>=2.20.0",
    "gdown",
    "ipykernel",
]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
